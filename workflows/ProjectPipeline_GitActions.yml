name: GestBib CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/gestbib

jobs:
  # ------------------------------------------------------------------
  # 1. BUILD ET TESTS
  # ------------------------------------------------------------------
  build-and-test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gestbib-auth-service, gestbib-catalog-service, gestbib-borrow-service]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.service }}/package-lock.json'

      - name: Installation des dépendances & Tests
        run: |
          cd ${{ matrix.service }}
          npm ci
          # Lancer les tests si un script de test existe dans package.json
          npm test --if-present

  # ------------------------------------------------------------------
  # 2. BUILD DOCKER ET PUSH (GHCR)
  # ------------------------------------------------------------------
  docker-build-push:
    name: Build & Push Docker Images
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    strategy:
      matrix:
        include:
          - service: gestbib-auth-service
            image_name: auth-service
          - service: gestbib-catalog-service
            image_name: catalog-service
          - service: gestbib-borrow-service
            image_name: borrow-service
          - service: gestbib-frontend
            image_name: frontend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion au Container Registry GitHub (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extraction des métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image_name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ------------------------------------------------------------------
  # 3. DÉPLOIEMENT KUBERNETES
  # ------------------------------------------------------------------
  deploy-kubernetes:
    name: Deploy to Kubernetes Cluster
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Appliquer les manifestes Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/
          kubectl apply -f k8s/monitoring/

      - name: Redémarrer les déploiements pour utiliser les nouvelles images
        run: |
          kubectl rollout restart deployment auth-service -n gestbib
          kubectl rollout restart deployment catalog-service -n gestbib
          kubectl rollout restart deployment borrow-service -n gestbib
          kubectl rollout restart deployment frontend -n gestbib