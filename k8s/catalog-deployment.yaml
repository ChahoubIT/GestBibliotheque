apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: gestbib
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
      - name: catalog-service
        image: chahoubit/gestbib-catalog-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: DB_HOST
          value: "db"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: "rootpassword"
        - name: DB_NAME
          value: "gestbib_catalog"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: gestbib
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
  selector:
    app: catalog-service
