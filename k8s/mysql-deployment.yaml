apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestbib-mysql
  namespace: gestbib
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestbib-mysql
  template:
    metadata:
      labels:
        app: gestbib-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "rootpassword"
        - name: MYSQL_DATABASE
          value: "gestbib_auth"
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: gestbib
spec:
  ports:
  - port: 3306
    targetPort: 3306
  selector:
    app: gestbib-mysql
