apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: gestbib
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: chahoubit/gestbib-auth-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: DB_HOST
          value: "db"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: "rootpassword"
        - name: DB_NAME
          value: "gestbib_auth"
        - name: JWT_SECRET
          value: "gestbib_secret_key_2026"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: gestbib
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: auth-service
