apiVersion: apps/v1
kind: Deployment
metadata:
  name: borrow-service
  namespace: gestbib
spec:
  replicas: 2
  selector:
    matchLabels:
      app: borrow-service
  template:
    metadata:
      labels:
        app: borrow-service
    spec:
      containers:
      - name: borrow-service
        image: chahoubit/gestbib-borrow-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3002
        env:
        - name: PORT
          value: "3002"
        - name: DB_HOST
          value: "db"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: "rootpassword"
        - name: DB_NAME
          value: "gestbib_borrow"
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:3000"
---
apiVersion: v1
kind: Service
metadata:
  name: borrow-service
  namespace: gestbib
spec:
  type: ClusterIP
  ports:
  - port: 3002
    targetPort: 3002
  selector:
    app: borrow-service
